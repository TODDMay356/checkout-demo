<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞来汇收银台 · 交互演示</title>
<style>
/* ============================================================
   §7 品牌 Token —— 编辑入口之一（颜色/圆角一律从此取）
   ============================================================ */
:root{
  /* §A.1 真实品牌 token（从生产源码校正，取代旧的自造配色） */
  --bg:#F1F2F5; --card:#FFFFFF; --card-radius:16px; --radius-m:8px;
  --card-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 24px rgba(16,24,40,.06);
  --brand-ink:#5548FF;      /* 品牌强调（原深蓝，改为真实主色紫 basic-primary） */
  --accent:#5548FF;         /* 选中/强调 —— 真实 basic-primary */
  --accent-soft:#F1F0FF;    /* 选中底 —— 真实 basic-primary-light */
  --radio-checked:#6366F1;  /* 收银台 radio 选中点 —— 真实 radio-checked */
  --pay-btn:#000000;        /* 黑色支付按钮 */
  --text:#171717; --text-muted:#817F86; --text-secondary:#38373D;
  --success:#21A470;        /* 页脚安全声明绿 —— 真实 success-green */
  --line:#E4E3EA; --line-regular:#E4E3EA;
  --font-amount:"IBM Plex Sans Condensed",Manrope,Lato,Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}
.muted{color:var(--text-muted)}

/* 顶部应用条 */
/* 防滥用：全局演示警示条（sticky 置顶，始终可见） */
.demo-warn{position:sticky;top:0;z-index:200;background:#B91C1C;color:#fff;font-size:12.5px;font-weight:700;
  text-align:center;padding:7px 14px;letter-spacing:.2px;line-height:1.4}
.appbar{
  background:#fff;border-bottom:1px solid var(--line);
  padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
/* 结果弹窗上的"演示模拟"标签（防止只截弹窗冒充真实结果） */
.modal-demo{background:#FEF2F2;color:#B91C1C;font-size:11px;font-weight:700;text-align:center;
  border-radius:8px;padding:6px 10px;margin-bottom:14px;letter-spacing:.2px}
.appbar .logo{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--brand-ink)}
.tabs{display:flex;gap:6px;background:#F1F2F6;padding:4px;border-radius:10px}
.tab{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--text-muted);font-weight:600}
.tab.active{background:#fff;color:var(--brand-ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}
.appbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{padding:6px 12px;font-size:13px;color:var(--text-muted);background:#fff}
.seg button.active{background:var(--accent);color:#fff}

/* 体验模式选择器栏 */
.selectbar{
  background:#fff;border-bottom:1px solid var(--line);padding:14px 18px;
  display:flex;gap:24px;flex-wrap:wrap;align-items:flex-end;
}
.selgroup{display:flex;flex-direction:column;gap:6px}
.selgroup>label{font-size:12px;color:var(--text-muted);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:13px;
  background:#fff;color:var(--text);transition:.15s;
}
.chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
select.nice{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff}

/* 组合支持标识 */
.combo-banner{padding:10px 18px;font-size:13px;font-weight:600;display:none}
.combo-banner.warn{display:block;background:#FEF3C7;color:#92400E;border-bottom:1px solid #FDE68A}
.combo-banner.plan{display:block;background:#EEF2FF;color:#3730A3;border-bottom:1px solid #C7D2FE}

/* 主区 */
.stage{padding:24px 18px;min-height:60vh}
.stage-inner{max-width:980px;margin:0 auto}
.viewport-phone .stage-inner{max-width:390px;border:10px solid #111;border-radius:36px;
  background:var(--bg);padding:14px 10px;box-shadow:var(--card-shadow)}

/* mock 店铺 */
.shop{background:#fff;border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow)}
.shop-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.shop-badge{font-weight:800;letter-spacing:.3px;color:var(--brand-ink);font-size:18px}
.shop-badge small{display:block;font-size:10px;color:var(--text-muted);font-weight:500;letter-spacing:0}
.shop-body{padding:22px;display:flex;gap:22px;flex-wrap:wrap}
.prod-img{width:200px;height:200px;border-radius:12px;background:
  repeating-linear-gradient(45deg,#F3F4F6,#F3F4F6 12px,#E9EBEF 12px,#E9EBEF 24px);
  display:flex;align-items:center;justify-content:center;color:#9AA1AC;font-size:13px;flex:0 0 auto}
.prod-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:10px}
.prod-info h2{font-size:20px;color:var(--brand-ink)}
.prod-price{font-size:26px;font-weight:800;color:var(--text)}
.btn-primary{background:var(--accent);color:#fff;padding:12px 22px;border-radius:10px;font-weight:700;font-size:15px;align-self:flex-start}
.btn-ghost{border:1px solid var(--line);padding:10px 18px;border-radius:10px;font-weight:600;color:var(--text)}

/* 收银台本体 */
.checkout-wrap{max-width:680px;margin:0 auto}
.fake-url{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;
  font-size:12px;color:var(--text-muted);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.fake-url b{color:#16A34A}
/* §8 模块显隐控制条（演示控件，非收银台本体） */
.abcd-bar{display:flex;align-items:center;gap:10px 20px;flex-wrap:wrap;background:#1E293B;color:#E2E8F0;border-radius:10px;padding:10px 14px;margin-bottom:12px}
.abcd-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.abcd-title{font-size:12px;font-weight:600;color:#94A3B8}
.abcd-toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:7px;background:#334155;color:#CBD5E1}
.abcd-toggle .abcd-dot{width:8px;height:8px;border-radius:50%;background:#64748B}
.abcd-toggle.on{background:var(--accent);color:#fff}
.abcd-toggle.on .abcd-dot{background:#fff}
.embed-frame{border:2px dashed var(--accent);border-radius:14px;padding:4px;background:var(--accent-soft)}

/* 商户自有结账页外壳（内嵌/API直连/Element 用，表明不离站） */
.mshell{max-width:900px;margin:0 auto}
.browser{background:#E3E6EB;border-radius:12px 12px 0 0;padding:8px 12px;display:flex;align-items:center;gap:8px}
.browser .dots{display:flex;gap:5px}
.browser .dots i{width:11px;height:11px;border-radius:50%;display:inline-block}
.browser .dots i:nth-child(1){background:#FF5F57}.browser .dots i:nth-child(2){background:#FEBC2E}.browser .dots i:nth-child(3){background:#28C840}
.browser .url{flex:1;background:#fff;border-radius:7px;padding:6px 12px;font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
.browser .url b{color:#16A34A}
.browser .stay{font-size:11px;color:#16A34A;font-weight:700;white-space:nowrap}
.mpage{background:#fff;border-radius:0 0 12px 12px;box-shadow:var(--card-shadow);overflow:hidden}
.mhead{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mhead .mlogo{font-weight:800;color:var(--brand-ink);font-size:18px;letter-spacing:.3px}
.mhead .mnav{margin-left:auto;display:flex;gap:18px;font-size:13px;color:var(--text-muted)}
.mhead .secure{font-size:12px;color:#16A34A;font-weight:600;display:flex;align-items:center;gap:4px}
/* 结账进度面包屑（结构上表明"结账"是商户自有流程中的一步，不是外部页面） */
.mcrumb{display:flex;align-items:center;gap:8px;padding:12px 26px 0;font-size:12px;color:var(--text-muted)}
.mcrumb i{color:#C7CAD1}
.mcrumb b{color:var(--brand-ink)}
/* 左「商品/订单」 右「收银」——同一张商户结账页，无硬分界（仅用留白 + 轻底色分组） */
.mbody{display:flex;gap:36px;padding:24px 26px 28px;align-items:flex-start}
.mcol-sum{flex:0.9;min-width:0}
.mcol-pay{flex:1.1;min-width:0}
/* 左栏「商品介绍」（上部）：主图 + 缩略图 + 标题/评分/卖点/价格/标签 */
.prod-img{border-radius:10px;position:relative;background:
  repeating-linear-gradient(45deg,#EDEFF3,#EDEFF3 9px,#E2E5EB 9px,#E2E5EB 18px)}
.prod-hero{margin-bottom:18px}
.prod-img-lg{width:100%;height:190px;border-radius:12px}
.prod-thumbs{display:flex;gap:8px;margin-top:8px}
.prod-thumbs i{width:52px;height:52px;border-radius:8px;background:
  repeating-linear-gradient(45deg,#F0F2F5,#F0F2F5 7px,#E5E8ED 7px,#E5E8ED 14px)}
.prod-thumbs i:first-child{box-shadow:0 0 0 2px var(--accent)}
.prod-intro{margin-top:14px}
.prod-title{font-size:17px;font-weight:700;color:var(--brand-ink);line-height:1.35}
.prod-rating{font-size:12px;color:var(--text-muted);margin-top:6px;display:flex;align-items:center;gap:6px}
.prod-rating .stars{color:#F5A623;letter-spacing:1px}
.prod-sell{font-size:13px;color:var(--text-secondary);margin-top:6px}
.prod-price{font-size:24px;font-weight:800;color:var(--accent);margin-top:10px}
.prod-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.prod-tags span{font-size:11px;color:var(--success);background:#EAF7F1;border:1px solid #CDEDE0;border-radius:6px;padding:3px 8px;font-weight:600}
/* 订单小结 */
.osum-block{border-top:1px solid var(--line);padding-top:14px}
.osum-line{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin:8px 2px}
.osum-total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;color:var(--brand-ink);border-top:1px solid var(--line);padding-top:14px;margin-top:10px}
/* 左栏「商品详情」（下部） */
.prod-detail{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}
.pd-title{font-size:14px;font-weight:700;color:var(--brand-ink);margin-bottom:10px}
.pd-list{list-style:none;margin:0 0 12px;padding:0}
.pd-list li{position:relative;padding-left:20px;font-size:13px;color:var(--text-secondary);line-height:1.5;margin:6px 0}
.pd-list li::before{content:"✓";position:absolute;left:0;color:var(--success);font-weight:700}
.pd-imgs{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.pd-imgs span{width:100%;height:150px;border-radius:10px;background:
  repeating-linear-gradient(45deg,#F0F2F5,#F0F2F5 9px,#E6E9EE 9px,#E6E9EE 18px)}
.pd-desc{font-size:12px;color:var(--text-muted);line-height:1.7}
.powered{font-size:11px;color:var(--text-muted);text-align:center;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:5px}
.pay-h{font-size:15px;color:var(--brand-ink);margin:0 0 16px;font-weight:700}
/* Element 商品页右侧「购买框」：商户呈现金额 + 内嵌飞来汇 Element */
.buybox{position:sticky;top:16px;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 2px 10px rgba(16,24,40,.05);background:#fff}
.buybox-order{display:flex;align-items:center;justify-content:space-between;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line)}
.buybox-order .bo-item{font-size:13px;color:var(--text-secondary)}
.buybox-order .bo-total{font-size:14px;color:var(--text-muted)}
.buybox-order .bo-total b{font-size:20px;color:var(--brand-ink);margin-left:6px;font-weight:800}
.el-inline-note{display:flex;gap:7px;align-items:flex-start;font-size:11px;color:var(--text-muted);line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.el-inline-note svg{flex:0 0 auto;margin-top:2px}
@media(max-width:640px){.buybox{position:static}}
.mtitle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtitle-row h3{margin:0;font-size:15px;color:var(--brand-ink)}
.host-tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:5px}
.host-fly{background:var(--accent-soft);color:var(--accent)}
.host-mer{background:#FEF3C7;color:#92400E}
/* 地址栏"未跳转"实时指示（会呼吸的绿点，非纯文字标签） */
.browser .stay{display:flex;align-items:center;gap:6px}
.live-dot{width:8px;height:8px;border-radius:50%;background:#16A34A;display:inline-block;box-shadow:0 0 0 0 rgba(22,163,74,.5);animation:livePulse 1.8s infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 6px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
@media(max-width:640px){.mbody{flex-direction:column;gap:24px}.mcrumb{padding:12px 16px 0}}
.embed-tag{font-size:11px;color:var(--accent);font-weight:700;padding:4px 8px}

/* ===== Element（主推）/ API 直连：内嵌于商户结账页的收银区（无框、无硬分界，融入商户页面） ===== */
.el-body{display:flex;flex-direction:column}
.pay-card-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.pay-card-head .payment-icon{width:28px;height:20px}
.pay-card-head .pm-name{font-size:14px;font-weight:600;color:var(--text)}
.pay-card-head .pc-brands{margin-left:auto;display:flex}
.pay-card-head .pc-brands .cards{margin:0}
.submit-btn.el-full{min-width:0;width:100%;margin-top:16px;background:var(--accent)}
.el-or{display:flex;align-items:center;gap:12px;margin:18px 2px}
.el-or .l{flex:1;height:1px;background:var(--line-regular)}
.el-or .t{font-size:12px;color:var(--text-muted);white-space:nowrap}
.el-wallets{display:flex;flex-direction:column;gap:10px}
.wallet-express{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;height:48px;border-radius:8px;background:#000;color:#fff;cursor:pointer;border:none}
.wallet-express .wb-logo{display:block}
.wallet-express .wb-txt{font-size:18px;font-weight:500;letter-spacing:.2px}
.pay-footnote{font-size:11px;color:var(--text-muted);margin-top:16px;line-height:1.6;padding-top:12px;border-top:1px dashed var(--line)}

.co{background:transparent}
/* ===== 托管收银台"整页"外壳（灰底 + 全宽白头 + 居中内容列，照真实生产 §A.2） ===== */
.cashier{background:var(--bg);border-radius:14px;overflow:hidden}
.ck-header{background:#fff;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 32px;box-shadow:inset 0 -1px #e5e5e5}
.ck-logo{height:30px;display:flex;align-items:center}
.ck-logo svg{height:30px;display:block}
.ck-lang-wrap{position:relative}
.ck-lang{display:flex;align-items:center;gap:5px;font-size:14px;color:var(--text-secondary);font-weight:500;cursor:pointer;border:1px solid #D2D1D8;background:#fff;border-radius:20px;padding:6px 12px}
.ck-caret{transition:transform .15s}
.ck-caret.up{transform:rotate(180deg)}
.ck-lang-menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line-regular);border-radius:10px;box-shadow:0 8px 24px rgba(16,24,40,.12);padding:4px;min-width:120px;z-index:20}
.ck-lang-item{padding:8px 12px;font-size:14px;color:var(--text-secondary);border-radius:6px;cursor:pointer;display:flex;justify-content:space-between}
.ck-lang-item:hover{background:var(--bg)}
.ck-lang-item.on{color:var(--accent);font-weight:600}
.ck-main{max-width:574px;margin:0 auto;padding:12px 12px 40px}
@media(max-width:640px){.ck-header{padding:0 16px}}

/* ===== §A.2 order-box（金额卡：C 金额 / B 付给） ===== */
.order-box{background:#fff;border-radius:var(--card-radius);padding:32px;text-align:left}
.order-amount{display:flex;align-items:baseline;justify-content:center;gap:4px;color:var(--text);line-height:1.4;padding:20px 0}
.order-amount .cur{font-size:14px;color:var(--text-muted);font-weight:500}
.order-amount .num{font-family:var(--font-amount);font-size:48px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.order-amount .num i{font-size:24px;font-style:normal}
.order-detail{margin-top:20px}
.order-detail .li{display:flex;gap:8px;line-height:20px}
.order-detail .label{color:var(--text-muted);min-width:80px}
.order-detail .value{color:var(--text);font-weight:500}

/* ===== §A.2 tabset（支付区） ===== */
.tabset{background:#fff;border-radius:var(--card-radius);padding:24px 16px;margin-top:12px}
.pm-list{display:flex;flex-direction:column;gap:12px}
.pm{transition:.12s}
/* 选中态：紫框只包"标题行"，展开内容是下面独立的一块（照真实生产结构） */
.payment-header{display:flex;align-items:center;min-height:60px;padding:0 16px;cursor:pointer;gap:12px;border:1px solid var(--line-regular);border-radius:var(--radius-m);background:#fff;transition:border-color .12s,background .12s}
.pm.sel .payment-header{border-color:var(--accent);background:var(--accent-soft)}
.el-rad{width:18px;height:18px;border-radius:50%;border:2px solid #d1d5db;flex:0 0 auto;position:relative;background:#fff}
.pm.sel .el-rad{border-color:var(--radio-checked)}
.pm.sel .el-rad::after{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:var(--radio-checked)}
.payment-content{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:500;font-size:16px;width:100%}
.payment-icon{width:28px;height:20px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.payment-icon svg,.payment-icon img.pm-ico{display:block;width:28px;height:20px;object-fit:contain}
.pm-name{flex:0 0 auto}
/* Card 行卡组织 logo 条（照真源码 .cards）*/
.cards{display:flex;gap:4px;align-items:center;margin-left:auto;flex:0 0 auto}
.cards .card-img{height:20px;width:auto;display:block;border-radius:3px}
.brand-ico .card-img{height:18px}
.pm-content{display:none;margin-top:10px}
.pm.sel .pm-content{display:block}
.wallet-hint{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:var(--radius-m);padding:14px 16px;color:var(--text-muted);line-height:20px;font-size:14px}
.wallet-hint svg.wtip{flex:0 0 auto;width:46px;height:auto;display:block}
.wtip-lead{color:var(--accent)}       /* 前半句（含钱包名）紫色 */
.wtip-tail{color:var(--text-muted)}   /* 后半句灰色 */
.wallet-hint b{color:var(--accent);font-weight:600}
.pm-note{color:var(--text-muted);font-size:12px;line-height:18px;margin-top:14px;text-align:center}

/* 合并卡表单（§A.3：卡号独占一行 + MM/YY | CVV 第二行） */
.field-label{color:var(--text-secondary);font-weight:500;margin:2px 0 8px}
.card-group{border:1px solid var(--line-regular);border-radius:var(--radius-m);overflow:hidden;transition:border-color .12s}
.card-group:focus-within{border-color:var(--accent)}   /* 聚焦时合并框边框变紫 */
.cg-row{display:flex}
.cg-cell{display:flex;align-items:center;padding:0 12px;height:48px;flex:1;min-width:0}
.cg-cell input{border:none;outline:none;height:100%;width:100%;font-size:14px;background:transparent;color:var(--text)}
.cg-cell input::placeholder{color:#b8b7bd}
.cg-num{border-bottom:1px solid var(--line-regular)}
.cg-exp{border-right:1px solid var(--line-regular)}
.brand-ico{display:flex;gap:3px;align-items:center;flex:0 0 auto;margin-left:8px}
.brand-ico img,.brand-ico svg{height:18px;width:auto;display:block;border-radius:3px}
.cvv-ico{flex:0 0 auto;margin-left:6px;display:flex;align-items:center}
.cvv-ico img{height:16px;width:auto;display:block}
.cf-element-tag{font-size:10px;color:var(--accent);font-weight:700;margin-top:6px}
.pci-note{font-size:11px;color:var(--text-muted);margin-top:6px}

/* PIX / Boleto 表单（§A.4） */
.lpm-form{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.lpm-field{display:flex;flex-direction:column;gap:6px}
.lpm-field label{color:var(--text-secondary);font-weight:500;font-size:13px}
.lpm-field input{border:1px solid var(--line-regular);border-radius:var(--radius-m);height:48px;padding:0 12px;font-size:14px;color:var(--text);outline:none}
.lpm-field input:focus{border-color:var(--accent)}
.lpm-field input[readonly]{background:#f7f7f9;color:var(--text-muted)}
/* 拆分卡「卡号」框：卡组织图标放在输入框内右侧（与合并卡一致） */
.lpm-num-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--line-regular);border-radius:var(--radius-m);height:48px;padding:0 12px}
.lpm-num-wrap:focus-within{border-color:var(--accent)}
.lpm-num-wrap input{border:none;outline:none;flex:1;min-width:0;height:100%;font-size:14px;background:transparent;color:var(--text)}
.lpm-num-wrap .brand-ico{margin-left:auto}

/* 提交按钮 */
.submit-box{display:flex;justify-content:center;width:100%;margin:20px 0 0}
.submit-btn{border-radius:24px;font-size:16px;font-weight:600;height:48px;min-width:260px;background:var(--pay-btn);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px}
/* 钱包按钮：黑底 + logo + "Pay"（Apple Pay 白苹果 / Google Pay 彩色 G） */
.submit-btn.wallet-btn{background:#000;gap:5px}
.submit-btn.wallet-btn .wb-logo{display:block}
.submit-btn.wallet-btn .wb-txt{font-size:18px;font-weight:500;letter-spacing:.2px}
@media(max-width:400px){.submit-btn{min-width:100%;width:100%}}

/* 页脚 D（§A.5） */
.page-footer{max-width:518px;margin:24px auto 0;font-size:14px;text-align:center;padding:0 16px}
.foot-title{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--success);font-weight:600;line-height:22px;margin-bottom:12px}
.foot-title .line{flex:1;height:1px;background:linear-gradient(90deg,rgba(217,217,217,0),#d9d9d9)}
.foot-title .line.r{background:linear-gradient(270deg,rgba(217,217,217,0),#d9d9d9)}
.foot-title .text{flex-shrink:0;display:flex;align-items:center;gap:6px}
.foot-item{display:flex;align-items:flex-start;justify-content:flex-start;gap:8px;color:var(--text-muted);line-height:20px;margin:4px 0}
.foot-item .pre{color:var(--success);flex:0 0 auto;padding-top:2px}
.certificate{display:flex;justify-content:center;padding:14px 0 6px}
.cert-badges{width:100%;max-width:480px;height:auto;display:block}  /* 真实认证徽标（无白框）：VISA Secure/Discover/Diners/ProtectBuy/MC ID Check/PCI DSS/Amex SafeKey/JCB */
.foot-fine{color:#a5a4aa;line-height:18px;font-size:12px;margin-top:6px}
.foot-links{color:var(--text-muted);font-size:13px;margin-top:10px}
.foot-links b{color:var(--text-secondary)}

/* 商户视角 */
.merch{background:#fff;border-radius:14px;box-shadow:var(--card-shadow);padding:22px;max-width:760px;margin:0 auto}
.merch h3{color:var(--brand-ink);margin-bottom:14px}
.steps{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.step{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:14px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;margin-bottom:8px}
.step h4{font-size:14px;margin-bottom:4px}
.step p{font-size:12px;color:var(--text-muted)}
.code-toggle{font-size:13px;font-weight:700;color:var(--accent);cursor:pointer;user-select:none}
pre.code{background:#0F172A;color:#E2E8F0;border-radius:10px;padding:14px;font-size:12px;overflow:auto;margin-top:10px;line-height:1.6;display:none}
pre.code.open{display:block}
.sdk-note{margin-top:12px;font-size:12px;color:var(--text-muted);background:var(--accent-soft);padding:10px 12px;border-radius:8px}
/* 支付流程图（原商户视角） */
.flowview{max-width:640px}
.flow-badge{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:6px 14px;border-radius:20px;font-size:13px;font-weight:600;margin-bottom:16px}
.flow-legend{display:flex;gap:14px;margin-bottom:20px;font-size:12px;color:var(--text-muted)}
.flow-legend .lg{display:flex;align-items:center;gap:6px}
.flow-legend .lg::before{content:"";width:10px;height:10px;border-radius:50%;display:inline-block}
.flow-legend .lg-m::before{background:#0EA5E9}
.flow-legend .lg-f::before{background:var(--accent)}
.flow{display:flex;flex-direction:column}
.flow-node{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:26px}
.flow-node:last-child{padding-bottom:0}
.flow-node:not(:last-child)::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line-regular)}
.flow-num{width:32px;height:32px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:14px;position:relative;z-index:1}
.n-merchant .flow-num{background:#0EA5E9}
.n-flyway .flow-num{background:var(--accent)}
.flow-body{padding-top:3px}
.flow-who{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px}
.n-merchant .flow-who{background:#E0F2FE;color:#0369A1}
.n-flyway .flow-who{background:var(--accent-soft);color:var(--accent)}
.flow-label{margin-top:7px;font-size:15px;color:var(--text);line-height:1.5}

/* 能力总览 */
.overview{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.panel{background:#fff;border-radius:14px;box-shadow:var(--card-shadow);padding:22px}
.panel h3{color:var(--brand-ink);margin-bottom:14px}
table.matrix{width:100%;border-collapse:collapse;font-size:14px}
table.matrix th,table.matrix td{border:1px solid var(--line);padding:10px;text-align:center}
table.matrix th{background:#F8FAFC;color:var(--brand-ink)}
table.matrix td:first-child,table.matrix th:first-child{text-align:left;font-weight:700}
.yes{color:var(--success);font-weight:800}
.no{color:#CBD2DC;font-weight:800}
.planned{color:#9AA1AC;font-style:italic;border:1px dashed #C7D2FE;border-radius:6px;padding:2px 6px;font-size:12px}
.summary{font-size:13px;color:var(--text-muted);margin-top:12px}
.cov{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.cov span{font-size:12px;background:#F1F2F6;border-radius:20px;padding:5px 12px;font-weight:600;color:var(--text)}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.statbox{flex:1;min-width:140px;border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center}
.statbox .v{font-size:28px;font-weight:800;color:var(--accent)}
.statbox .k{font-size:12px;color:var(--text-muted);margin-top:4px}
.ph-tag{display:inline-block;font-size:10px;background:#FEF3C7;color:#92400E;border-radius:4px;padding:1px 5px;margin-left:4px;font-weight:700}

/* 导演控制台 */
.console{position:fixed;right:18px;bottom:18px;z-index:50;width:300px;
  background:#0F172A;color:#E2E8F0;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.4);overflow:hidden}
.console-head{padding:12px 14px;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:#1E293B}
.console-body{padding:12px 14px;display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow:auto}
.console.collapsed .console-body{display:none}
.cg{display:flex;flex-direction:column;gap:6px}
.cg>label{font-size:11px;color:#94A3B8;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.cbtns{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{background:#334155;color:#E2E8F0;font-size:12px;padding:6px 10px;border-radius:7px;font-weight:600}
.cbtn.active{background:var(--accent);color:#fff}
.switch{display:flex;align-items:center;gap:8px;font-size:12px}
.toggle{width:38px;height:22px;border-radius:20px;background:#475569;position:relative;transition:.15s;flex:0 0 auto}
.toggle.on{background:var(--accent)}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:18px}
.csel{background:#1E293B;color:#E2E8F0;border:1px solid #334155;border-radius:7px;padding:6px 8px;font-size:12px}
.creset{background:#7F1D1D;color:#FECACA}

/* 弹层（成功/失败/3DS/挽留） */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:16px;max-width:420px;width:100%;padding:26px;text-align:center;box-shadow:var(--card-shadow)}
.modal .ic{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:32px}
.modal .ic.ok{background:#DCFCE7;color:var(--success)}
.modal .ic.err{background:#FEE2E2;color:#DC2626}
.modal .ic.info{background:#E0E7FF;color:var(--accent)}
.modal h3{margin-bottom:8px;color:var(--brand-ink)}
.modal p{color:var(--text-muted);font-size:14px;margin-bottom:18px}
.modal .acts{display:flex;gap:10px;justify-content:center}
.spinner{width:46px;height:46px;border:4px solid #E5E7EB;border-top-color:var(--accent);border-radius:50%;margin:0 auto 16px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tds-bar{background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;padding:10px;border-radius:8px;margin-bottom:14px}

/* 失败弹窗（照真实生产截图：小号图标+标题同行、左对齐正文、单个渐变宽按钮） */
.modal.fail-modal{text-align:left;padding:22px 22px 24px;position:relative}
.fail-head{display:flex;align-items:center;gap:10px}
.fail-head .ic-sm{width:32px;height:32px;border-radius:50%;background:#FEE2E2;color:#DC2626;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;flex:0 0 auto}
.fail-head h3{flex:1;margin:0;color:var(--text);font-size:16px}
.fail-x{cursor:pointer;color:var(--text-muted);font-size:18px;line-height:1;flex:0 0 auto;padding:2px}
.fail-msg{color:var(--text);font-size:14px;line-height:1.65;margin:14px 0 20px}
.fail-msg .code{color:#B8B7BD;font-size:12px;margin-left:4px;white-space:nowrap}
.fail-btn-wide{display:block;width:100%;height:48px;border:none;border-radius:24px;background:linear-gradient(90deg,#6366F1,#5548FF);color:#fff;font-weight:600;font-size:15px}

@media(max-width:640px){
  .selectbar{gap:14px}
  .shop-body{flex-direction:column}
  .prod-img{width:100%}
  .console{width:calc(100% - 36px)}
}
</style>
</head>

<div id="app"></div>
<div id="console-root"></div>
<div id="overlay-root"></div>
